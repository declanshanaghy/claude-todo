name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  # The engine whose kit runs the tests and whose declarations tsc and ESLint
  # read; bump it with the version you develop against.
  CLAUDE_CODE_VERSION: 2.1.316

# One job per check, so each passes or fails on its own (the Badges workflow
# reads the coverage gate's conclusion and the Tests job's tally); `check`
# gathers them into the one result a branch needs.
jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          claude-code-version: ${{ env.CLAUDE_CODE_VERSION }}
          types: 'true'
      - run: npm run lint

  typecheck:
    name: Typecheck (strict tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          claude-code-version: ${{ env.CLAUDE_CODE_VERSION }}
          types: 'true'
      - run: npm run typecheck

  validate:
    name: Plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          claude-code-version: ${{ env.CLAUDE_CODE_VERSION }}
      - run: claude plugin validate .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          claude-code-version: ${{ env.CLAUDE_CODE_VERSION }}
          sqlite3: 'true'
      - run: claude plugin test .

  coverage:
    name: Behaviour coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm run coverage

  check:
    name: All checks
    if: always()
    needs: [lint, typecheck, validate, test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
